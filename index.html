<style>
/* Layout: B2B product site. Hero with a product frame, what it replaces, the foundation modules,
   a view per role, the assistant, how setup works, industries, integrations, a savings estimate,
   security, annual plans, founder, FAQ, closing call. Arabic (RTL) and English, light and dark. */
:root {
  --bg: #F5F7F8; --surface: #FFFFFF; --surface-2: #EBF0F2; --ink: #122028; --muted: #56686F; --faint: #8A9BA2; --line: #D9E1E4;
  --accent: #0E5A73; --accent-ink: #FFFFFF; --accent-soft: #DCEBF0; --cta: #D9600E; --cta-ink: #FFFFFF;
  --deep: #0A3F52; --deep-ink: #EEF6F8; --deep-accent: #8FD0E6;
  --good: #1C7A52; --good-soft: #DCF3E6; --warn: #8F5300; --warn-soft: #FBEED6; --crit: #A8261E; --crit-soft: #F9E0DE; --wa: #128C4A;
  --shadow: 0 18px 50px rgba(10, 40, 52, .14);
  --display: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #0F1A1F; --surface: #15232A; --surface-2: #1C2D35; --ink: #E9F1F3; --muted: #9DB1B9; --faint: #6E848C; --line: #28404A;
  --accent: #5FB3CE; --accent-ink: #0F1A1F; --accent-soft: #1B3942; --cta: #F2873D; --cta-ink: #14181A;
  --deep: #0A2530; --deep-ink: #E9F1F3; --deep-accent: #8FD0E6;
  --good: #4FC98B; --good-soft: #143327; --warn: #E6AE52; --warn-soft: #33270F; --crit: #F08A82; --crit-soft: #3A1B19; --wa: #4CD08A;
  --shadow: 0 18px 50px rgba(0,0,0,.5); } }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1A1F; --surface: #15232A; --surface-2: #1C2D35; --ink: #E9F1F3; --muted: #9DB1B9; --faint: #6E848C; --line: #28404A;
  --accent: #5FB3CE; --accent-ink: #0F1A1F; --accent-soft: #1B3942; --cta: #F2873D; --cta-ink: #14181A;
  --deep: #0A2530; --deep-ink: #E9F1F3; --deep-accent: #8FD0E6;
  --good: #4FC98B; --good-soft: #143327; --warn: #E6AE52; --warn-soft: #33270F; --crit: #F08A82; --crit-soft: #3A1B19; --wa: #4CD08A;
  --shadow: 0 18px 50px rgba(0,0,0,.5); }
html[lang="ar"] { --display: "IBM Plex Sans Arabic", "Outfit", system-ui, sans-serif; --sans: "IBM Plex Sans Arabic", "Figtree", system-ui, sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 72px; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; margin: 0; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
p { margin: 0; }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
html[lang="ar"] .eyebrow { letter-spacing: 0; font-size: 14px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
section { padding-block: 76px; }
.sec-head { display: grid; gap: 10px; max-width: 720px; margin-bottom: 34px; }
.sec-head h2 { font-size: clamp(27px, 3.6vw, 38px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
html[lang="ar"] .sec-head h2 { letter-spacing: 0; line-height: 1.4; }
.sec-head p { color: var(--muted); font-size: 17px; }
.alt { background: var(--surface-2); }

/* nav */
nav.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav-in { display: flex; align-items: center; gap: 16px; padding-block: 11px; }
.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; margin-inline-end: auto; }
.logo i { width: 30px; height: 30px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-style: normal; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 600; font-size: 16px; }
.logo b { font-family: "Outfit", sans-serif; font-weight: 700; font-size: 20px; }
html[lang="ar"] .logo b { font-family: "IBM Plex Sans Arabic", sans-serif; }
.links { display: flex; gap: 18px; font-size: 14.5px; }
.links a { text-decoration: none; color: var(--muted); }
.links a:hover { color: var(--ink); }
.ghostbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; height: 36px; padding-inline: 11px; font-weight: 600; font-size: 14px; }
.theme { width: 36px; padding: 0; display: grid; place-items: center; }
.theme svg { width: 18px; height: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding-inline: 20px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; text-decoration: none; white-space: nowrap; font-size: 15.5px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.navy { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { height: 36px; padding-inline: 13px; font-size: 14px; border-radius: 6px; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* hero */
.hero { padding-block: 60px 44px; }
.hero-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 44px; align-items: center; }
.hero h1 { font-size: clamp(36px, 5.2vw, 58px); font-weight: 800; letter-spacing: -.03em; line-height: 1.04; }
html[lang="ar"] .hero h1 { letter-spacing: 0; line-height: 1.3; font-weight: 700; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lead { font-size: 18.5px; color: var(--muted); margin: 18px 0 26px; max-width: 34em; }
.ctas { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .note { margin-top: 14px; font-size: 14px; color: var(--muted); }
/* product frame */
.frame { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; font-size: 12.5px; }
.fbar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.fbar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.fbar span { margin-inline-start: 8px; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.fbody { display: grid; grid-template-columns: 128px minmax(0, 1fr) minmax(0, 200px); min-height: 330px; }
.fside { background: var(--deep); color: var(--deep-ink); padding: 10px 8px; display: grid; gap: 2px; align-content: start; }
.fside b { font-size: 11.5px; padding: 2px 6px 8px; }
.fside span { padding: 5px 6px; border-radius: 4px; color: color-mix(in srgb, var(--deep-ink) 75%, transparent); display: flex; justify-content: space-between; }
.fside span.on { background: color-mix(in srgb, var(--deep-ink) 14%, transparent); color: var(--deep-ink); }
.fside em { font-style: normal; font-family: var(--mono); font-size: 10px; background: var(--cta); color: #fff; border-radius: 3px; padding: 0 4px; }
.fmain { padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.fk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.fk div { background: var(--surface); padding: 7px 9px; display: grid; }
.fk b { font-size: 17px; font-variant-numeric: tabular-nums; }
.fk small { color: var(--muted); font-size: 10.5px; }
.frow { display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px 7px 0; border: 1px solid var(--line); border-radius: 6px; }
html[dir="rtl"] .frow { padding: 7px 0 7px 8px; }
.frow i { align-self: stretch; } .frow i.c { background: var(--crit); } .frow i.w { background: var(--warn); }
.frow .t { font-weight: 600; } .frow .d { color: var(--muted); font-size: 11px; }
.tagp { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 3px; margin-inline-start: 5px; }
.tagp.c { background: var(--crit-soft); color: var(--crit); } .tagp.w { background: var(--warn-soft); color: var(--warn); }
.frow .wa { font-size: 11px; font-weight: 600; color: var(--wa); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
.fai { border-inline-start: 1px solid var(--line); padding: 10px; display: grid; gap: 8px; align-content: start; background: var(--surface); }
.fai > b { font-size: 12px; }
.fq { justify-self: end; background: var(--accent); color: var(--accent-ink); padding: 5px 8px; border-radius: 6px 6px 2px 6px; font-size: 11.5px; max-width: 95%; }
.fa { font-size: 11.5px; display: grid; gap: 5px; }
.fa table { border-collapse: collapse; width: 100%; font-size: 10.5px; }
.fa td { border-bottom: 1px solid var(--line); padding: 3px 2px; }
.fa .how { color: var(--muted); font-size: 10.5px; }

/* what it replaces */
.replace { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.replace > div { padding: 26px; }
.replace .before { background: color-mix(in srgb, var(--surface-2) 70%, var(--bg)); }
.replace h3 { font-size: 14px; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
html[lang="ar"] .replace h3 { font-family: var(--sans); letter-spacing: 0; font-size: 15px; }
.replace .after h3 { color: var(--good); }
.replace ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
.replace li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 15px; }
.replace .before li { color: var(--muted); }
.replace li b { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; font-size: 12px; }
.replace .after li b { background: var(--good-soft); color: var(--good); }

/* modules */
.mods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mod { background: var(--surface); padding: 18px; display: grid; gap: 10px; align-content: start; }
.mod h3 { font-size: 13px; font-family: var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--accent); }
html[lang="ar"] .mod h3 { letter-spacing: 0; font-size: 15px; }
.mod ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mod li b { display: block; font-size: 15px; }
.mod li span { font-size: 13.5px; color: var(--muted); }
.foundation-note { margin-top: 16px; color: var(--muted); font-size: 15px; max-width: 70ch; }

/* roles */
.roles { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.rtabs { display: grid; align-content: start; border-inline-end: 1px solid var(--line); background: color-mix(in srgb, var(--surface-2) 60%, var(--surface)); }
.rtabs button { text-align: start; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 14px 18px; display: grid; gap: 2px; }
.rtabs button b { font-size: 16px; }
.rtabs button span { font-size: 13px; color: var(--muted); }
.rtabs button[aria-selected="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--cta); }
html[dir="rtl"] .rtabs button[aria-selected="true"] { box-shadow: inset -3px 0 0 var(--cta); }
.rpanel { padding: 24px 26px; display: grid; gap: 14px; align-content: start; }
.rpanel h3 { font-size: 22px; font-weight: 700; }
.rpanel ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.rpanel li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 15.5px; }
.rpanel li b { color: var(--accent); }
.rpanel .sees { font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

/* assistant */
.asst { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.qa { display: grid; gap: 10px; }
.qa div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.qa b { font-size: 15px; }
.qa span { color: var(--muted); font-size: 14px; }
.trust { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.trust li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.trust li .ic { width: 34px; height: 34px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.trust li .ic svg { width: 18px; height: 18px; }
.trust li b { display: block; }
.trust li span { color: var(--muted); font-size: 14.5px; }

/* steps */
.dark { background: var(--deep); color: var(--deep-ink); }
.dark .sec-head p, .dark .muted { color: color-mix(in srgb, var(--deep-ink) 72%, transparent); }
.dark .eyebrow { color: var(--deep-accent); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.step { display: grid; gap: 8px; align-content: start; border-top: 2px solid color-mix(in srgb, var(--deep-ink) 25%, transparent); padding-top: 16px; }
.step .n { font-family: var(--mono); font-size: 13px; color: var(--deep-accent); }
.step h3 { font-size: 20px; font-weight: 600; }
.step p { font-size: 15px; }

/* industries */
.inds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ind { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.ind h3 { font-size: 17px; font-weight: 600; }
.ind ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.ind li { font-size: 14px; color: var(--muted); padding-inline-start: 14px; position: relative; }
.ind li::before { content: ""; position: absolute; inset-inline-start: 0; top: .6em; width: 6px; height: 6px; border-radius: 1px; background: var(--accent); }

/* integrations */
.ints { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.intg { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 12px; align-content: start; }
.intg h3 { font-size: 15px; display: flex; gap: 8px; align-items: center; }
.intg h3 i { width: 9px; height: 9px; border-radius: 50%; }
.intg.now h3 i { background: var(--good); } .intg.setup h3 i { background: var(--accent); } .intg.ask h3 i { background: var(--faint); }
.intg p { font-size: 13.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; font-size: 13.5px; background: var(--bg); }

/* savings */
.calc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.calc-in { padding: 24px; display: grid; gap: 16px; border-inline-end: 1px solid var(--line); }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }
.field label output { font-family: var(--mono); color: var(--accent); }
.field input[type="range"] { width: 100%; accent-color: var(--accent); }
.field small { color: var(--muted); font-size: 12.5px; }
.calc-out { padding: 24px; display: grid; gap: 14px; align-content: start; background: color-mix(in srgb, var(--surface-2) 50%, var(--surface)); }
.big { font-family: var(--display); font-size: clamp(30px, 4vw, 42px); font-weight: 800; color: var(--accent); line-height: 1.05; font-variant-numeric: tabular-nums; }
.calc-out dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; margin: 0; font-size: 14.5px; }
.calc-out dt { color: var(--muted); } .calc-out dd { margin: 0; font-family: var(--mono); text-align: end; }
.calc-out .fine { font-size: 12.5px; color: var(--muted); }

/* security */
.sec-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.sec-item { border-top: 2px solid var(--accent); padding-top: 14px; display: grid; gap: 6px; }
.sec-item b { font-size: 16px; }
.sec-item span { color: var(--muted); font-size: 14.5px; }

/* plans */
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
.est { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.est > div { padding: 24px; display: grid; gap: 12px; align-content: start; }
.est > div + div { border-inline-start: 1px solid var(--line); }
.est-main { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }
.est-big { font-family: "Outfit", sans-serif; font-size: clamp(36px, 5vw, 48px); font-weight: 800; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.est-unit { color: var(--muted); font-size: 15px; margin-top: -4px; }
.est-fine { font-size: 13px; color: var(--muted); }
.est h3 { font-size: 16px; }
.est ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14.5px; }
.est li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; }
.est li svg { width: 16px; height: 16px; margin-top: 3px; color: var(--good); }
@media (max-width: 960px) { .est { grid-template-columns: minmax(0, 1fr); } .est > div + div { border-inline-start: 0; border-top: 1px solid var(--line); } }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 14px; align-content: start; position: relative; }
.plan.hot { border: 2px solid var(--accent); }
.plan .tag { position: absolute; top: -11px; inset-inline-start: 22px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 4px; }
.plan h3 { font-size: 21px; font-weight: 700; }
.plan .for { color: var(--muted); font-size: 14.5px; margin-top: -8px; }
.price { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.price b { font-family: "Outfit", sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.price span { color: var(--muted); font-size: 14.5px; }
.permo { font-size: 13.5px; color: var(--muted); margin-top: -8px; }

  en: [["Can I see it before talking to anyone?", "Yes. The live demo runs the real app on a sample company. Pick your type of business at the top, and use “View as” to switch between owner, manager, team lead, agent and field staff."], ["Do we need to install anything?", "No. Jreebs runs in the browser on any computer, tablet or phone. Your team gets a link and a login."], ["We run on Excel, Google Sheets, Odoo or Zoho. Do we have to switch?", "No. Jreebs sits next to them. Import from Excel in minutes, or link your Google Sheet and it keeps syncing: new and changed rows come in on their own, so your team can move over at their own pace. Direct connections to other systems are added when they are worth it."], ["What does the assistant do with our data?", "It reads only what the person asking is allowed to see, answers inside your workspace, and can't change records without a click. Your data isn't used to train AI models."], ["What does setup include?", "It is part of your quote: the check-up, building your workspace (statuses, rules, templates, SOPs), importing your data, adding your team and training them. Most setups take about a week."], ["What does it cost?", "Most companies pay around 4,000 JOD a year, and many pay less. It depends on how many people need a login, which kinds of work you track, and what we connect for you. You get a written quote after a free check-up. Billed yearly, before 16% sales tax."], ["Who owns the data?", "You do. Export everything any time. If you stop, we hand it all over and delete it from our side."]],
  ar: [["بقدر أشوفه قبل ما أحكي مع حدا؟", "أكيد. النسخة التجريبية هي التطبيق الحقيقي على شركة تجريبية. اختار نوع شغلك من فوق، واستخدم «عرض كـ» لتبدّل بين صاحب الشركة والمدير وقائد الفريق والموظف والفريق الميداني."], ["لازم ننزّل إشي؟", "لا. مغطينك بيشتغل على المتصفح من أي كمبيوتر أو تابلت أو موبايل. فريقك بياخذ رابط وحساب."], ["إحنا شغالين على إكسل أو Google Sheets أو Odoo أو Zoho. لازم نغيّر؟", "لا. مغطينك بيشتغل جنبهم. استورد من إكسل بدقايق، أو اربط ملف Google Sheets وبضل يتزامن لحاله: الصفوف الجديدة والمعدّلة بتوصل لحالها، وفريقك بينتقل على راحته. الربط المباشر مع الأنظمة الثانية بينضاف لما يستاهل."], ["شو بيعمل المساعد ببياناتنا؟", "بيقرأ بس اللي مسموح للشخص اللي بيسأل يشوفه، وبيجاوب جوّا مساحتك، وما بيغيّر أي سجل بدون كبسة. وبياناتك ما بتستخدم لتدريب نماذج الذكاء الاصطناعي."], ["شو بيشمل التجهيز؟", "هو جزء من عرض السعر: الفحص، بناء مساحتك (الحالات والقواعد والرسائل والإجراءات)، استيراد بياناتك، إضافة فريقك وتدريبهم. أغلب التجهيزات بتاخذ أسبوع تقريباً."], ["قديش بيكلّف؟", "أغلب الشركات بتدفع حوالي ٤٬٠٠٠ دينار بالسنة، وكثير منها أقل. السعر بيعتمد على عدد اللي بدهم حساب، وأنواع الشغل اللي بتتابعها، وشو منربط إلك. بتاخذ عرض سعر مكتوب بعد فحص مجاني. دفع سنوي، غير شامل ضريبة المبيعات ١٦٪."], ["لمين البيانات؟", "إلك. صدّر كل شي بأي وقت. وإذا وقفت، منسلّمك كل شي ومنحذفه من عنا."]]
};
const FRAME = {
  en: { url: "jreebs.com/app", nav: [["Home", ""], ["Customer requests", "7"], ["Sales pipeline", ""], ["Orders", "12"], ["Tasks", "6"], ["Inbox", "4"], ["Approvals", "4"]], title: "Needs attention", k: [["25", "open requests"], ["81%", "on time"], ["3", "overdue now"]], rows: [["c", "R-1013 · Jana Q.", "Overdue 2 h", "Billing · Urgent · Bilal"], ["c", "O-1044 · Leen N.", "Late 3 h", "229 JOD · 2 items · Khaled"], ["w", "Email · Orient Supplies", "Needs reply", "Price list update from 1 Nov"]], send: "Send", ai: "Assistant", q: "What is overdue right now?", a: "3 items are overdue right now.", how: "How I got this · 1 lookup", tbl: [["R-1013", "2 h", "Bilal"], ["O-1044", "3 h", "Khaled"], ["T-1031", "1 day", "Lina"]] },
  ar: { url: "jreebs.com/app", nav: [["الرئيسية", ""], ["طلبات العملاء", "٧"], ["المبيعات", ""], ["الطلبات", "١٢"], ["المهام", "٦"], ["المحادثات", "٤"], ["الموافقات", "٤"]], title: "بحاجة لانتباه", k: [["٢٥", "طلب عميل مفتوح"], ["٨١٪", "بالوقت"], ["٣", "متأخر الآن"]], rows: [["c", "R-1013 · جنى ق.", "متأخر ساعتين", "فواتير · عاجل · بلال"], ["c", "O-1044 · لين ن.", "متأخر ٣ ساعات", "٢٢٩ د.أ · قطعتين · خالد"], ["w", "إيميل · Orient Supplies", "بحاجة رد", "تحديث الأسعار من ١ تشرين الثاني"]], send: "إرسال", ai: "المساعد", q: "شو المتأخر هلأ؟", a: "في ٣ أشياء متأخرة هلأ.", how: "كيف وصلت للجواب · بحث واحد", tbl: [["R-1013", "ساعتين", "بلال"], ["O-1044", "٣ ساعات", "خالد"], ["T-1031", "يوم", "لينا"]] }
};

let lang = "en", role = 0;
try { const s = localStorage.getItem("rasd-site-lang"); lang = s || ((navigator.language || "").startsWith("ar") ? "ar" : "en"); } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = n => lang === "ar" ? Number(n).toLocaleString("ar-EG") : Number(n).toLocaleString("en-US");
const wa = text => "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);

function renderRoles() {
  const R = ROLES[lang][role];
  $("#rtabs").innerHTML = ROLES[lang].map(([n, s], i) => `<button type="button" role="tab" aria-selected="${i === role}" data-role="${i}"><b>${esc(n)}</b><span>${esc(s)}</span></button>`).join("");
  $("#rpanel").innerHTML = `<h3>${esc(R[1])}</h3><ul>${R[2].map(x => `<li><b aria-hidden="true">✓</b><span>${esc(x)}</span></li>`).join("")}</ul><p class="sees">${esc(R[3])}</p>`;
}
function renderCalc() {
  const t = T[lang], a = +$("#cAgents").value, s = +$("#cSalary").value, h = +$("#cHours").value, p = +$("#cShare").value;
  $("#oAgents").textContent = num(a); $("#oSalary").textContent = num(s); $("#oHours").textContent = num(h); $("#oShare").textContent = num(p) + "%";
  const hoursMonth = a * h * 22 * p / 100, value = hoursMonth * 12 * (s / (22 * 8));
  $("#calcOut").innerHTML = `<div><div class="big">${num(Math.round(hoursMonth))}</div><div class="muted">${esc(t.outHours)}</div></div>
    <dl><dt>${esc(t.outValue)}</dt><dd>${num(Math.round(value))} ${lang === "ar" ? "د.أ" : "JOD"}</dd></dl>
    <p class="fine">${esc(t.outFine)}</p>`;
}
function render() {
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-brand]").forEach(e => e.textContent = BRAND[lang]);
  document.querySelectorAll("[data-t]").forEach(e => { const k = e.dataset.t; if (t[k] != null) e.textContent = t[k]; });
  document.querySelectorAll("[data-th]").forEach(e => { const k = e.dataset.th; if (t[k] != null) e.innerHTML = t[k]; });
  document.querySelectorAll("[data-wa='demo']").forEach(e => e.href = wa(t.waDemo));
  $("#langBtn").textContent = lang === "ar" ? "English" : "العربية";
  $("#langBtn").setAttribute("aria-label", lang === "ar" ? "Switch to English" : "التبديل إلى العربية");
  $("#email").textContent = EMAIL;
  const F = FRAME[lang];
  $("#frame").innerHTML = `<div class="fbar"><i></i><i></i><i></i><span>${F.url}</span></div><div class="fbody">
    <div class="fside"><b>Cedar Trading Co.</b>${F.nav.map(([n, c], i) => `<span class="${i === 1 ? "on" : ""}">${esc(n)}${c ? `<em>${c}</em>` : ""}</span>`).join("")}</div>
    <div class="fmain"><div class="fk">${F.k.map(([v, l], i) => `<div><b style="${i === 2 ? "color:var(--crit)" : i === 1 ? "color:var(--warn)" : ""}">${v}</b><small>${esc(l)}</small></div>`).join("")}</div>
      <b>${esc(F.title)}</b>${F.rows.map(([s, a, p, d]) => `<div class="frow"><i class="${s}"></i><div style="min-width:0"><div class="t">${esc(a)}<span class="tagp ${s}">${esc(p)}</span></div><div class="d">${esc(d)}</div></div><span class="wa">${esc(F.send)}</span></div>`).join("")}</div>
    <div class="fai"><b>${esc(F.ai)}</b><div class="fq">${esc(F.q)}</div><div class="fa"><b>${esc(F.a)}</b><table>${F.tbl.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table><span class="how">${esc(F.how)}</span></div></div></div>`;
  $("#beforeList").innerHTML = BEFORE[lang].map(s => `<li><b aria-hidden="true">✕</b><span>${esc(s)}</span></li>`).join("");
  $("#afterList").innerHTML = AFTER[lang].map(s => `<li><b aria-hidden="true">✓</b><span>${esc(s)}</span></li>`).join("");
  $("#mods").innerHTML = MODS[lang].map(([g, items]) => `<div class="mod"><h3>${esc(g)}</h3><ul>${items.map(([n, d]) => `<li><b>${esc(n)}</b><span>${esc(d)}</span></li>`).join("")}</ul></div>`).join("");
  renderRoles();
  $("#qa").innerHTML = QA[lang].map(([q, a]) => `<div><b>“${esc(q)}”</b><span>${esc(a)}</span></div>`).join("");
  $("#trust").innerHTML = TRUST[lang].map(([ic, h, p]) => `<li><span class="ic">${IC[ic]}</span><div><b>${esc(h)}</b><span>${esc(p)}</span></div></li>`).join("");
  $("#steps").innerHTML = STEPS[lang].map(([h, w, p], i) => `<div class="step"><span class="n">${num(i + 1)} · ${esc(w)}</span><h3>${esc(h)}</h3><p class="muted">${esc(p)}</p></div>`).join("");
  $("#inds").innerHTML = INDS[lang].map(([h, list]) => `<div class="ind"><h3>${esc(h)}</h3><ul>${list.map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>`).join("");
  $("#ints").innerHTML = INTS[lang].map(([k, h, p, list]) => `<div class="intg ${k}"><h3><i aria-hidden="true"></i>${esc(h)}</h3><p>${esc(p)}</p><div class="chips">${list.map(x => `<span>${esc(x)}</span>`).join("")}</div></div>`).join("");
  $("#secGrid").innerHTML = SECURITY[lang].map(([h, p]) => `<div class="sec-item"><b>${esc(h)}</b><span>${esc(p)}</span></div>`).join("");
  $("#plans-grid").innerHTML = `<div class="est"><div class="est-main"><div class="est-big">${esc(t.estBig)}</div><div class="est-unit">${esc(t.estUnit)}</div><a class="btn primary" href="${wa(t.waDemo)}" target="_blank" rel="noopener">${esc(t.estCta)}</a><p class="est-fine">${esc(t.estFine)}</p></div>
    <div><h3>${esc(t.estDepends)}</h3><ul>${t.estD.map(x => `<li>${IC.yes}<span>${esc(x)}</span></li>`).join("")}</ul></div>
    <div><h3>${esc(t.estIncluded)}</h3><ul>${t.estI.map(x => `<li>${IC.yes}<span>${esc(x)}</span></li>`).join("")}</ul></div></div>`;
  $("#facts").innerHTML = FACTS[lang].map(([b, s]) => `<div class="fact"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
  $("#faqList").innerHTML = FAQ[lang].map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
  renderCalc(); renderTheme();
}

const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => { const a = document.documentElement.getAttribute("data-theme"); return a ? a === "dark" : darkMQ.matches; };
function renderTheme() { const b = $("#themeBtn"), dark = isDark(); b.innerHTML = dark ? IC.sun : IC.moon; const l = lang === "ar" ? (dark ? "الوضع الفاتح" : "الوضع الداكن") : (dark ? "Switch to light mode" : "Switch to dark mode"); b.setAttribute("aria-label", l); b.title = l; }
darkMQ.addEventListener("change", renderTheme);
document.addEventListener("input", e => { if (e.target.matches(".calc input")) renderCalc(); });
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "themeBtn") { const next = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", next); try { localStorage.setItem("jreebs-theme", next); } catch (err) {} return renderTheme(); }
  if (b.id === "langBtn") { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("rasd-site-lang", lang); } catch (err) {} return render(); }
  if (b.dataset.role) { role = +b.dataset.role; return renderRoles(); }
  if (b.id === "copyEmail") {
    const el = $("#toast");
    try { await navigator.clipboard.writeText(EMAIL); el.textContent = T[lang].copied; }
    catch (err) { const r = document.createRange(); r.selectNodeContents($("#email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); el.textContent = "Ctrl+C"; }
    el.hidden = false; setTimeout(() => el.hidden = true, 2200);
  }
});
render();
})();
</script>
