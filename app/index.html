<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jreebs</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A3F52">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23E2640F'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Tahoma,sans-serif' fill='white' text-anchor='middle'%3E%D8%AC%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("jreebs-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css?v=8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="login" id="login" hidden><form class="lcard" id="loginForm" novalidate></form></div>

<div class="shell" id="shell" hidden>
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="ws"><div class="lg">ج</div><div style="min-width:0"><b id="wsName">Jreebs</b><span id="wsSub"></span></div></div>
    <nav id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="top-in">
        <button class="ib menu-btn" type="button" data-act="menu" id="menuBtn" aria-label="Open menu"></button>
        <h1 id="title">Home</h1>
        <label class="search" for="q"><span id="qIcon"></span><input id="q" type="search" placeholder="Search and press Enter" autocomplete="off"></label>
        <span class="spacer"></span>
        <span class="tag-demo" id="demoTag" hidden>Demo · sample data</span>
        <button class="btn ask" type="button" data-act="ask" id="askBtn" title="Ask about your data (press /)"></button>
        <label class="viewas" for="tplSel" id="tplWrap" hidden><span>Business</span><select id="tplSel"></select></label>
        <label class="viewas" for="roleSel" hidden><span>View as</span>
          <select id="roleSel">
            <option value="owner">Owner · Rana</option>
            <option value="manager">Manager · Omar</option>
            <option value="team_lead">Team lead · Lina</option>
            <option value="supervisor">Supervisor · Yazan</option>
            <option value="agent">Agent · Dana</option>
            <option value="driver">Driver · Saif</option>
          </select>
        </label>
        <button class="ib" type="button" data-act="notif" id="bellBtn" aria-label="Notifications"></button>
        <button class="ib" type="button" data-act="theme" id="themeBtn" aria-label="Switch theme"></button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<aside class="ai" id="ai" hidden aria-label="Assistant"></aside>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true"></aside>
<div class="mscrim" id="mscrim" hidden></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="core.js?v=8"></script>
<script src="shell.js?v=8"></script>
<script src="views-work.js?v=8"></script>
<script src="views-team.js?v=8"></script>
<script src="views-company.js?v=8"></script>
<script src="views-insights.js?v=8"></script>
<script src="views-setup.js?v=8"></script>
<script src="views-admin.js?v=8"></script>
<script src="views-ai.js?v=8"></script>
<script src="views-email.js?v=8"></script>
<script src="views-provider.js?v=8"></script>
<script src="views-more.js?v=8"></script>
<script src="demo.js?v=8"></script>
<script src="events.js?v=8"></script>
</body>
</html>
