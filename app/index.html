<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jreebs — sign in</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #F4F4F2; --surface: #FFFFFF; --surface-2: #ECECE8; --ink: #1B1D21; --muted: #60646C; --line: #DCDDD8;
  --accent: #7B2E63; --accent-ink: #FFFFFF; --accent-soft: #F3E2EE;
  --good: #1E7A4B; --good-soft: #DDF0E5; --warn: #9E5C00; --warn-soft: #FBEED6; --crit: #B3261E; --crit-soft: #F9E0DE;
  --wa: #128C4A; --shadow: 0 12px 40px rgba(27,29,33,.18);
  --display: "Outfit", system-ui, sans-serif; --sans: "Figtree", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark;
    --bg:#121316; --surface:#1B1C20; --surface-2:#26282D; --ink:#ECEDEF; --muted:#9A9EA6; --line:#2E3036;
    --accent:#E794C9; --accent-ink:#121316; --accent-soft:#3A2133;
    --good:#5CCB8E; --good-soft:#15301F; --warn:#E6AE52; --warn-soft:#33270F; --crit:#F08A82; --crit-soft:#3A1B19;
    --wa:#4CD08A; --shadow:0 12px 40px rgba(0,0,0,.5); }
}
:root[data-theme="dark"] { color-scheme: dark;
  --bg:#121316; --surface:#1B1C20; --surface-2:#26282D; --ink:#ECEDEF; --muted:#9A9EA6; --line:#2E3036;
  --accent:#E794C9; --accent-ink:#121316; --accent-soft:#3A2133;
  --good:#5CCB8E; --good-soft:#15301F; --warn:#E6AE52; --warn-soft:#33270F; --crit:#F08A82; --crit-soft:#3A1B19;
  --wa:#4CD08A; --shadow:0 12px 40px rgba(0,0,0,.5); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.login-wrap { min-height: 100svh; display: grid; place-items: center; padding: 24px; }
.login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; box-shadow: var(--shadow); }
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.login-logo i { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-style: normal; font-family: var(--display); font-weight: 700; font-size: 17px; }
.login-logo b { font-family: var(--display); font-size: 21px; font-weight: 700; }
.login-card h1 { font-family: var(--display); font-size: 20px; font-weight: 600; margin: 0 0 4px; }
.login-card p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; }
.field { display: grid; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.field input { height: 40px; border: 1px solid var(--line); border-radius: 9px; padding-inline: 12px; background: var(--bg); color: var(--ink); }
.field input:focus-visible { border-color: var(--accent); }
.login-btn { width: 100%; height: 42px; border-radius: 9px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; margin-top: 4px; }
.login-btn:hover { filter: brightness(1.06); }
.login-btn:disabled { opacity: .6; cursor: default; }
.login-err { background: var(--crit-soft); color: var(--crit); border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 14px; }
.login-ok { background: var(--good-soft); color: var(--good); border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 14px; }
.login-foot { text-align: center; margin-top: 18px; font-size: 12.5px; color: var(--muted); }
.login-switch { background: none; border: 0; color: var(--accent); font-weight: 600; text-decoration: underline; padding: 0; }

.app { display: none; }
.app.show { display: block; }
.login-wrap.hide { display: none; }
header.top { position: sticky; top: env(safe-area-inset-top,0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 15px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 19px; }
.pill-plan { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
.spacer { margin-inline-end: auto; }
.btn { height: 34px; display: inline-flex; align-items: center; gap: 6px; padding-inline: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: 13.5px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { height: 30px; padding-inline: 9px; font-size: 13px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-block: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; display: grid; gap: 3px; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi.alert .v { color: var(--crit); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.panel > h3 { margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); font-family: var(--display); font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(150px,1.4fr) 1fr .9fr .8fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.row.head { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding-block: 8px; }
.row:last-child { border-bottom: 0; }
.who b { font-weight: 600; display: block; }
.who span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.cell { font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.pill.on { background: var(--accent-soft); color: var(--accent); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.good { background: var(--good-soft); color: var(--good); }
.empty { padding: 30px 14px; text-align: center; color: var(--muted); }
.toast { position: fixed; z-index: 60; inset-inline: 16px; bottom: calc(18px + env(safe-area-inset-bottom,0px)); margin-inline: auto; max-width: 420px; background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 10px; font-size: 13.5px; text-align: center; }

/* admin */
.admin-clients { display: grid; }
.aclient { display: grid; grid-template-columns: minmax(150px,1.4fr) .8fr .8fr .8fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.aclient:last-child { border-bottom: 0; }
.aclient .nm { font-weight: 600; }
.aclient .slug { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.link-row { display: flex; gap: 6px; align-items: center; }
.link-row input { height: 30px; border: 1px solid var(--line); border-radius: 7px; padding-inline: 8px; background: var(--bg); width: 150px; font-size: 12.5px; }
.modal-scrim { position: fixed; inset: 0; background: rgba(10,10,12,.45); z-index: 50; }
.modal { position: fixed; z-index: 51; inset-inline: 16px; top: 50%; transform: translateY(-50%); margin-inline: auto; max-width: 420px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 12px; }
.modal h3 { margin: 0; font-family: var(--display); font-size: 18px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
@media (max-width: 760px) { .row { grid-template-columns: minmax(0,1fr) auto; } .row .c-area, .row .c-owner, .row .c-due { display: none; } .kpis { grid-template-columns: repeat(2,minmax(0,1fr)); } .aclient { grid-template-columns: minmax(0,1fr) auto; } .aclient .c2, .aclient .c3, .aclient .c4 { display: none; } }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo"><i>ج</i><b>Jreebs</b></div>
    <h1 id="formTitle">Sign in</h1>
    <p class="sub" id="formSub">Your operations desk</p>
    <div class="login-err" id="loginErr" hidden></div>
    <div class="login-ok" id="loginOk" hidden></div>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6"></div>
      <button class="login-btn" type="submit" id="loginBtn">Sign in</button>
    </form>
    <p class="login-foot" id="switchMode">New here? <button class="login-switch" type="button" id="toSignup">Create an account</button></p>
  </div>
</div>

<div class="app" id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand"><div class="logo">ج</div><h1 id="clientName">—</h1></div>
      <span class="pill-plan" id="clientPlan"></span>
      <span class="spacer"></span>
      <button class="btn sm" type="button" id="signOutBtn">Sign out</button>
    </div>
  </header>
  <main class="wrap" id="workspaceView">
    <section class="kpis" id="kpis"></section>
    <section class="panel">
      <h3>Items</h3>
      <div class="rows" id="rows"></div>
    </section>
  </main>
  <main class="wrap" id="adminView" hidden>
    <h2 style="font-family:var(--display);font-size:22px;margin:18px 0 4px">All clients</h2>
    <p style="color:var(--muted);margin:0 0 16px;font-size:13.5px">You're signed in as an admin. Add clients and link their logins here.</p>
    <section class="panel">
      <h3><span>Clients</span><button class="btn sm primary" type="button" id="newClientBtn">+ New client</button></h3>
      <div class="admin-clients" id="adminClients"></div>
    </section>
  </main>
</div>

<div class="modal-scrim" id="newClientScrim" hidden></div>
<div class="modal" id="newClientModal" hidden>
  <h3>New client</h3>
  <div class="field"><label for="ncName">Company name</label><input id="ncName" type="text" placeholder="e.g. Swift Delivery"></div>
  <div class="field"><label for="ncSlug">Slug (used internally, no spaces)</label><input id="ncSlug" type="text" placeholder="swift-delivery"></div>
  <div class="field"><label for="ncType">Workspace type</label>
    <select id="ncType" style="height:40px;border:1px solid var(--line);border-radius:9px;padding-inline:12px;background:var(--bg);color:var(--ink)">
      <option value="delivery">Delivery</option>
      <option value="lab">Home-visit lab</option>
      <option value="kitchen">Cloud kitchen</option>
    </select>
  </div>
  <div class="field"><label for="ncPlan">Plan</label>
    <select id="ncPlan" style="height:40px;border:1px solid var(--line);border-radius:9px;padding-inline:12px;background:var(--bg);color:var(--ink)">
      <option value="starter">Starter</option>
      <option value="growth" selected>Growth</option>
      <option value="pro">Pro</option>
    </select>
  </div>
  <div class="modal-actions">
    <button class="btn sm" type="button" id="ncCancel">Cancel</button>
    <button class="btn sm primary" type="button" id="ncSave">Create client</button>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
const SUPABASE_URL = "https://gcjigukdiekalhibokhg.supabase.co";
const SUPABASE_KEY = "sb_publishable_zXqWbvDuUCYk4LNyFxVMiA_zGbELxA5";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastTimer, mode = "signin";
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3400); }
function showLogin() { $("#loginWrap").classList.remove("hide"); $("#app").classList.remove("show"); }
function showApp() { $("#loginWrap").classList.add("hide"); $("#app").classList.add("show"); }

function setMode(m) {
  mode = m;
  $("#loginErr").hidden = true; $("#loginOk").hidden = true;
  if (m === "signup") {
    $("#formTitle").textContent = "Create your account";
    $("#formSub").textContent = "You'll be assigned to a workspace next.";
    $("#loginBtn").textContent = "Create account";
    $("#switchMode").innerHTML = `Already have an account? <button class="login-switch" type="button" id="toSignin">Sign in</button>`;
    $("#toSignin").onclick = () => setMode("signin");
  } else {
    $("#formTitle").textContent = "Sign in";
    $("#formSub").textContent = "Your operations desk";
    $("#loginBtn").textContent = "Sign in";
    $("#switchMode").innerHTML = `New here? <button class="login-switch" type="button" id="toSignup">Create an account</button>`;
    $("#toSignup").onclick = () => setMode("signup");
  }
}
$("#toSignup").onclick = () => setMode("signup");

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#loginBtn"); btn.disabled = true;
  $("#loginErr").hidden = true; $("#loginOk").hidden = true;
  const email = $("#email").value.trim(), password = $("#password").value;
  if (mode === "signup") {
    const { error } = await sb.auth.signUp({ email, password });
    btn.disabled = false;
    if (error) { $("#loginErr").textContent = error.message; $("#loginErr").hidden = false; return; }
    const { data: { session } } = await sb.auth.getSession();
    if (session) return loadWorkspace();
    $("#loginOk").textContent = "Account created. You can sign in now.";
    $("#loginOk").hidden = false;
    setMode("signin");
    return;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error) { $("#loginErr").textContent = error.message; $("#loginErr").hidden = false; return; }
  await loadWorkspace();
});

$("#signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); showLogin(); });

async function loadWorkspace() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return showLogin();

  const { data: adminRow } = await sb.from("admins").select("auth_user_id").maybeSingle();
  if (adminRow) { showApp(); return loadAdmin(); }

  const { data: membership, error: mErr } = await sb.from("client_users").select("client_id, role").limit(1).maybeSingle();
  if (mErr || !membership) { toast("Your account isn't linked to a workspace yet. Ask your admin to add you."); return showLogin(); }

  const { data: client } = await sb.from("clients").select("*").eq("id", membership.client_id).single();
  if (!client) { toast("Couldn't load your workspace."); return showLogin(); }

  $("#clientName").textContent = client.name;
  $("#clientPlan").textContent = client.plan;
  $("#workspaceView").hidden = false; $("#adminView").hidden = true;
  showApp();

  const { data: items } = await sb.from("items").select("*").order("due", { ascending: true });
  renderWorkspace(client, items || []);
}

function renderWorkspace(client, items) {
  const now = Date.now();
  const openStatuses = it => !["delivered","collected","resolved","failed","noshow"].includes(it.status);
  const late = items.filter(i => openStatuses(i) && new Date(i.due).getTime() < now);
  $("#kpis").innerHTML = [
    ["Items", items.length, ""], ["Open", items.filter(openStatuses).length, ""],
    ["Late", late.length, late.length ? "alert" : ""], ["Plan", client.plan, ""]
  ].map(([l,v,cls]) => `<div class="kpi ${cls}"><span class="l">${esc(l)}</span><span class="v">${esc(v)}</span></div>`).join("");

  const head = `<div class="row head"><span>Item</span><span>Details</span><span class="c-area">Area</span><span class="c-owner">Owner</span><span></span></div>`;
  $("#rows").innerHTML = head + (items.length ? items.map(it => {
    const isLate = openStatuses(it) && new Date(it.due).getTime() < now;
    return `<div class="row">
      <div class="who"><b>${esc(it.name)}</b><span>${esc(it.ext_id)}</span></div>
      <div class="cell">${esc(it.data?.store || it.data?.test || it.data?.brand || "")}</div>
      <div class="cell c-area">${esc(it.area || "")}</div>
      <div class="cell c-owner">${esc(it.owner || "Unassigned")}</div>
      <div><span class="pill ${isLate ? "crit" : "on"}">${esc(it.status)}</span></div>
    </div>`;
  }).join("") : `<div class="empty">No items yet.</div>`);
}

async function loadAdmin() {
  $("#clientName").textContent = "Jreebs Admin";
  $("#clientPlan").textContent = "owner";
  $("#workspaceView").hidden = true; $("#adminView").hidden = false;
  await renderAdmin();
}

async function renderAdmin() {
  const { data: clients, error } = await sb.from("clients").select("*").order("created_at", { ascending: false });
  if (error) { toast("Couldn't load clients: " + error.message); return; }
  const { data: itemCounts } = await sb.from("items").select("client_id");
  const countBy = {};
  (itemCounts || []).forEach(i => countBy[i.client_id] = (countBy[i.client_id] || 0) + 1);

  $("#adminClients").innerHTML = (clients && clients.length) ? clients.map(c => `
    <div class="aclient">
      <div><div class="nm">${esc(c.name)}</div><div class="slug">${esc(c.slug)}</div></div>
      <div class="cell c2">${esc(c.workspace_type)}</div>
      <div class="cell c3"><span class="pill good">${esc(c.plan)}</span></div>
      <div class="cell c4">${countBy[c.id] || 0} items</div>
      <div class="link-row">
        <input type="email" placeholder="user@email.com" data-client="${esc(c.id)}" class="linkEmail">
        <button class="btn sm" type="button" data-link="${esc(c.id)}">Link</button>
      </div>
    </div>
  `).join("") : `<div class="empty">No clients yet. Click "+ New client" to add your first one.</div>`;
}

document.addEventListener("click", async e => {
  const linkBtn = e.target.closest("[data-link]");
  if (linkBtn) {
    const clientId = linkBtn.dataset.link;
    const input = document.querySelector(`.linkEmail[data-client="${clientId}"]`);
    const email = input.value.trim();
    if (!email) return toast("Enter the person's email first.");
    linkBtn.disabled = true;
    const { error } = await sb.rpc("admin_link_user", { p_client_id: clientId, p_email: email, p_role: "owner" });
    linkBtn.disabled = false;
    if (error) return toast(error.message);
    input.value = "";
    toast(`Linked ${email}.`);
    renderAdmin();
  }
});

$("#newClientBtn").addEventListener("click", () => { $("#newClientScrim").hidden = false; $("#newClientModal").hidden = false; });
$("#ncCancel").addEventListener("click", () => { $("#newClientScrim").hidden = true; $("#newClientModal").hidden = true; });
$("#newClientScrim").addEventListener("click", () => { $("#newClientScrim").hidden = true; $("#newClientModal").hidden = true; });
$("#ncSave").addEventListener("click", async () => {
  const name = $("#ncName").value.trim();
  let slug = $("#ncSlug").value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  if (!name) return toast("Enter a company name.");
  if (!slug) slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const { error } = await sb.from("clients").insert({ name, slug, workspace_type: $("#ncType").value, plan: $("#ncPlan").value, config: {} });
  if (error) return toast(error.message);
  $("#newClientScrim").hidden = true; $("#newClientModal").hidden = true;
  $("#ncName").value = ""; $("#ncSlug").value = "";
  toast(`${name} created.`);
  renderAdmin();
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { await loadWorkspace(); } else { showLogin(); }
})();
})();
</script>
</body>
</html>
