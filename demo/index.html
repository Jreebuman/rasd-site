<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jreebs demo — sample data</title>
<meta name="description" content="A live demo of Jreebs: three sample businesses (delivery, home-visit lab, cloud kitchen) with alerts, one-click WhatsApp and calls. All data shown is fake.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#7B2E63">
<link rel="canonical" href="https://jreebs.com/demo/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237B2E63'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Tahoma,sans-serif' fill='white' text-anchor='middle'%3E%D8%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
/* Layout: one operations desk, three sample client workspaces. Header switches workspace; KPIs, then "needs attention", the live queue, and automations + activity on the side. */
:root {
  --bg: #F4F4F2;
  --surface: #FFFFFF;
  --surface-2: #ECECE8;
  --ink: #1B1D21;
  --muted: #60646C;
  --line: #DCDDD8;
  --accent: #7B2E63;
  --accent-ink: #FFFFFF;
  --accent-soft: #F3E2EE;
  --good: #1E7A4B; --good-soft: #DDF0E5;
  --warn: #9E5C00; --warn-soft: #FBEED6;
  --crit: #B3261E; --crit-soft: #F9E0DE;
  --wa: #128C4A;
  --shadow: 0 12px 40px rgba(27, 29, 33, .18);
  --display: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --ar: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121316; --surface: #1B1C20; --surface-2: #26282D; --ink: #ECEDEF; --muted: #9A9EA6; --line: #2E3036;
    --accent: #E794C9; --accent-ink: #121316; --accent-soft: #3A2133;
    --good: #5CCB8E; --good-soft: #15301F; --warn: #E6AE52; --warn-soft: #33270F; --crit: #F08A82; --crit-soft: #3A1B19; --wa: #4CD08A;
    --shadow: 0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121316; --surface: #1B1C20; --surface-2: #26282D; --ink: #ECEDEF; --muted: #9A9EA6; --line: #2E3036;
  --accent: #E794C9; --accent-ink: #121316; --accent-soft: #3A2133;
  --good: #5CCB8E; --good-soft: #15301F; --warn: #E6AE52; --warn-soft: #33270F; --crit: #F08A82; --crit-soft: #3A1B19; --wa: #4CD08A;
  --shadow: 0 12px 40px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--ar); font-weight: 500; font-size: 17px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: -.01em; }
.chip { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.ws { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; margin-inline-end: auto; flex-wrap: wrap; }
.ws button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.ws button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.clock { display: inline-flex; align-items: baseline; gap: 6px; font-size: 12.5px; color: var(--muted); }
.clock b { font-family: var(--mono); font-size: 17px; color: var(--ink); font-weight: 500; }
.btn { height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding-inline: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; text-decoration: none; font-size: 13.5px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.sm { height: 30px; padding-inline: 9px; font-size: 13px; }
.btn.wa { color: var(--wa); }

.intro { margin-top: 14px; display: flex; gap: 8px 16px; align-items: baseline; flex-wrap: wrap; }
.intro h2 { margin: 0; font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.intro p { margin: 0; color: var(--muted); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-block: 14px 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; display: grid; gap: 3px; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--display); font-size: 29px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 15px; color: var(--muted); font-weight: 500; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.alert .v { color: var(--crit); }
.kpi.good .v { color: var(--good); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.panel > h3 { margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); font-family: var(--display); font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel > h3 small { font-family: var(--sans); font-weight: 400; color: var(--muted); font-size: 12px; }
.main { display: grid; gap: 16px; min-width: 0; }

.attn { display: grid; gap: 0; }
.att { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line); }
.att:last-child { border-bottom: 0; }
.att .bar { align-self: stretch; border-radius: 0 3px 3px 0; }
.att .bar.s3 { background: var(--crit); } .att .bar.s2 { background: var(--warn); } .att .bar.s1 { background: var(--muted); }
.att .t { font-weight: 600; }
.att .d { font-size: 13px; color: var(--muted); }
.empty { padding: 22px 14px; color: var(--muted); text-align: center; }

.tabs { display: flex; gap: 2px; padding-inline: 8px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 11px 10px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); }

.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(150px, 1.3fr) minmax(0, 1.3fr) .9fr .8fr .7fr minmax(130px, 1.2fr) auto; gap: 12px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.row.head { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding-block: 8px; }
.row:last-child { border-bottom: 0; }
.row.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.who { border: 0; background: none; padding: 0; text-align: start; min-width: 0; display: grid; }
.who b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.who:hover b { color: var(--accent); }
.cell { font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cell b { color: var(--ink); font-weight: 500; }
.st { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.on { background: var(--accent-soft); color: var(--accent); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.s3 { background: var(--crit-soft); color: var(--crit); }
.pill.s2 { background: var(--warn-soft); color: var(--warn); }
.pill.s1 { background: var(--surface-2); color: var(--ink); }
.acts { display: flex; gap: 6px; justify-content: flex-end; }
.ib { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.ib svg { width: 16px; height: 16px; }
.ib.wa { color: var(--wa); }
.ib.call { color: var(--accent); }
.ib:hover { border-color: currentColor; }

.rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); align-items: start; }
.rule:last-child { border-bottom: 0; }
.rule .n { font-weight: 600; font-size: 13.5px; }
.rule .x { font-size: 12.5px; color: var(--muted); grid-column: 1; }
.rule .c { font-size: 11.5px; color: var(--accent); font-weight: 600; grid-column: 1; }
.switch { position: relative; width: 38px; height: 22px; border-radius: 99px; border: 0; background: var(--surface-2); grid-row: span 3; margin-top: 2px; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.side { display: grid; gap: 16px; }
.feed { list-style: none; margin: 0; padding: 4px 0; max-height: 380px; overflow-y: auto; }
.feed li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 7px 14px; font-size: 13px; }
.feed time { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 1px; }
.feed li.rule-ev span::before { content: "⚡ "; color: var(--accent); }

.scrim { position: fixed; inset: 0; background: rgba(10, 10, 12, .45); z-index: 40; }
.scrim.top { z-index: 50; }
.drawer { position: fixed; inset-block: 0; inset-inline-end: 0; width: min(440px, 100%); background: var(--surface); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.d-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.d-head h4 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 600; }
.d-head .x { margin-inline-start: auto; }
.d-body { padding: 16px 18px; overflow-y: auto; display: grid; gap: 16px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; }
.kv div { display: grid; gap: 1px; }
.kv dt { font-size: 11.5px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }
.sec h5 { margin: 0 0 6px; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hist li { display: flex; gap: 10px; font-size: 13px; }
.hist time { font-family: var(--mono); font-size: 11.5px; color: var(--muted); min-width: 40px; }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.modal { position: fixed; z-index: 51; inset-inline: 16px; top: 50%; transform: translateY(-50%); margin-inline: auto; max-width: 470px; max-height: calc(100% - 32px); overflow-y: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; }
.modal h4 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 600; }
.modal p { margin: 0; color: var(--muted); font-size: 13px; }
.phone { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 10px; padding: 11px 13px; flex-wrap: wrap; }
.phone .mono { font-size: 18px; direction: ltr; user-select: all; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
textarea.msg { width: 100%; min-height: 100px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); resize: vertical; }
textarea.msg[dir="rtl"] { font-family: var(--ar); font-size: 15px; }
.outs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.out { text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; font-weight: 600; }
.out:hover { border-color: var(--accent); }
.toast { position: fixed; z-index: 60; inset-inline: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 440px; background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13.5px; }

@media (max-width: 1060px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .row.head { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who acts" "info info" "st st"; gap: 6px 10px; }
  .row .c-who { grid-area: who; } .row .c-acts { grid-area: acts; } .row .c-st { grid-area: st; }
  .row .c-x { grid-area: info; } .row .c-area, .row .c-own, .row .c-due { display: none; }
}
@media (max-width: 420px) {
  .kpi .v { font-size: 23px; }
  .outs, .kv { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><div class="logo" aria-hidden="true">ج</div><h1>Jreebs</h1></div>
    <span class="chip">Demo · sample data</span>
    <div class="ws" role="group" aria-label="Client workspace" id="wsSwitch"></div>
    <span class="clock">Today <b id="clock">14:00</b></span>
    <button class="btn primary" type="button" id="simBtn">+15 min</button>
    <button class="btn ghost" type="button" id="resetBtn">Reset</button>
  </div>
</header>

<main class="wrap">
  <div class="intro"><h2 id="wsTitle"></h2><p id="wsSub"></p></div>
  <section class="kpis" id="kpis" aria-label="Today's numbers"></section>
  <div class="grid">
    <div class="main">
      <section class="panel"><h3><span>Needs attention</span><small id="attnSub"></small></h3><div class="attn" id="attn"></div></section>
      <section class="panel"><div class="tabs" role="tablist" id="tabs"></div><div class="rows" id="rows"></div></section>
    </div>
    <aside class="side">
      <section class="panel"><h3><span>Automations</span><small>switch rules on or off</small></h3><div id="rules"></div></section>
      <section class="panel"><h3><span>Activity</span><small>live</small></h3><ul class="feed" id="feed"></ul></section>
    </aside>
  </div>
</main>

<div class="scrim" id="dScrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-label="Details"></aside>
<div class="scrim top" id="mScrim" hidden></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
const KEY = "jreebs-demo-v1";
const START = 14 * 60;
const ICON = {
  wa: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.2-.2-.4-.3Z"/></svg>',
  call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>'
};
const AREAS = ["Abdoun", "Sweifieh", "Khalda", "Tla' Al-Ali", "Shmeisani", "Jubeiha", "Dabouq", "Marj Al-Hamam", "Jabal Amman", "Um Uthaina"];
const FIRST = ["Ahmad", "Lina", "Omar", "Rania", "Khaled", "Dana", "Yousef", "Hiba", "Zaid", "Noor", "Tareq", "Reem", "Hamza", "Sara", "Faris", "Leen", "Majd", "Aseel"];
const LAST = ["Haddad", "Khalil", "Nasser", "Saleh", "Odeh", "Qasem", "Shami", "Zoubi", "Masri", "Rawashdeh", "Majali", "Abu Ghosh"];

const hm = m => { m = Math.max(0, Math.round(m)); return String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
const person = r => pick(r, FIRST) + " " + pick(r, LAST);
const phone = n => "+962 79 000 " + String(n).padStart(4, "0");
const fill = (s, it, now) => s.replace(/\{(\w+)\}/g, (_, k) => k === "due" ? hm(it.due) : k === "late" ? String(Math.max(0, now - it.due)) : k === "first" ? it.name.split(" ")[0] : (it[k] ?? ""));

/* ---------- workspace definitions ---------- */
const WS = {
  delivery: {
    name: "Swift Delivery", title: "Swift Delivery · order desk", sub: "Sample delivery company in Amman: orders, drivers, late alerts.",
    item: "Order", prefix: "D-", ownerLabel: "Driver", dueLabel: "Promised by",
    owners: ["Yazan", "Bilal", "Odai", "Saif", "Hamza"],
    stages: [["new", "New"], ["assigned", "Assigned"], ["picked", "On the way"], ["delivered", "Delivered"]],
    alt: [["failed", "Failed delivery"]],
    terminal: ["delivered", "failed"],
    x: it => `<b>${esc(it.store)}</b> · ${it.value} JOD`,
    templates: {
      late: ["Late order", "Hi {first}, sorry, your order {id} is running about {late} minutes late. {owner} is on the way to you.", "مرحبا {first}، نعتذر، طلبك رقم {id} متأخر حوالي {late} دقيقة. {owner} في الطريق إليك."],
      onway: ["On the way", "Hi {first}, your order {id} from {store} is on the way with {owner}.", "مرحبا {first}، طلبك رقم {id} من {store} في الطريق مع {owner}."],

/* ---------- state ---------- */
let S, cur = "delivery", tab = "active", openId = null;
function mk(st, ws, r, extra) {
  st.seq = (st.seq || 1040) + 1 + Math.floor(r() * 3);
  const it = { id: WS[ws].prefix + st.seq, name: person(r), phone: phone(st.seq), area: pick(r, AREAS), status: WS[ws].stages[0][0], owner: null, t: {}, hist: [], ...extra };
  it.t[it.status] = it.created;
  st.items.push(it); it.isNew = true;
  return it;
}
function setStage(it, s, at) { it.status = s; it.t[s] = at; it.hist.push({ at, text: "→ " + stageName(it, s) }); }
function stageName(it, s) { const w = Object.values(WS).find(w => w.prefix === it.id.slice(0, 2)); return [...w.stages, ...w.alt].find(x => x[0] === s)?.[1] || s; }
function fresh() {
  const s = { v: 1, now: START, ws: {} };
  Object.keys(WS).forEach((k, i) => {
    const r = rng(20261004 + i * 97);
    const st = { items: [], seq: 1040 + i * 300, rules: {}, fired: {}, feed: [] };
    WS[k].rules.forEach(rl => { st.rules[rl.id] = true; st.fired[rl.id] = 0; });
    WS[k].seed(r, st);
    st.items.forEach(it => { delete it.isNew; if (it.status !== WS[k].stages[0][0] && !it.owner) it.owner = pick(r, WS[k].owners); });
    s.ws[k] = st;
    evalRules(k, s, true);
  });
  return s;
}
function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.v === 1) return v; } catch (e) {} return fresh(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function log(ws, text, kind) { S.ws[ws].feed.unshift({ at: S.now, text, kind: kind || "" }); S.ws[ws].feed = S.ws[ws].feed.slice(0, 80); }

function evalRules(k, s, quiet) {
  s = s || S; const w = WS[k], st = s.ws[k], now = s.now;
  st.items.forEach(it => {
    if (w.terminal.includes(it.status)) { it.flags = []; return; }
    const old = new Set((it.flags || []).map(f => f.rule));
    it.flags = [];
    w.rules.forEach(rl => {
      if (rl.action || !st.rules[rl.id]) return;
      it.waited = now - it.created;
      const f = rl.check(it, now);
      if (f) {
        it.flags.push({ rule: rl.id, text: f, sev: rl.sev, tpl: rl.tpl });
        if (!old.has(rl.id)) { st.fired[rl.id]++; if (!quiet) { s.ws[k].feed.unshift({ at: now, text: rl.feed(it), kind: "rule-ev" }); } }
      }
    });
  });
  // action rules
  if (k === "delivery" && st.rules.autoassign) {
    st.items.filter(it => it.status === "new").forEach(it => {
      const load = d => st.items.filter(x => x.owner === d && ["assigned", "picked"].includes(x.status)).length;
      const d = [...w.owners].sort((a, b) => load(a) - load(b))[0];
      it.owner = d; setStage(it, "assigned", now); it.flags = it.flags.filter(f => f.rule !== "unassigned");
      st.fired.autoassign++;
      if (!quiet) s.ws[k].feed.unshift({ at: now, text: `${it.id} auto-assigned to ${d} (fewest active orders)`, kind: "rule-ev" });
    });
  }
  if (k === "kitchen" && st.rules.escalate) {
    st.items.filter(it => it.status === "new" && now - it.created > 30).forEach(it => {
      setStage(it, "escalated", now); it.owner = "Brand manager"; st.fired.escalate++;
      if (!quiet) s.ws[k].feed.unshift({ at: now, text: `${it.id} unanswered 30+ min. Escalated to the ${it.brand} manager`, kind: "rule-ev" });
    });
  }
  st.feed = st.feed.slice(0, 80);
}

      <div class="row-btns">
        <button class="btn wa" type="button" data-wa="${esc(it.id)}">${ICON.wa.replace("<svg", '<svg width="16" height="16"')} WhatsApp</button>
        <button class="btn" type="button" data-call="${esc(it.id)}">${ICON.call.replace("<svg", '<svg width="16" height="16"')} Call</button>
      </div>
      ${ws.terminal.includes(it.status) ? "" : `<div class="row-btns">
        ${next ? `<button class="btn primary" type="button" data-stage="${next[0]}">Mark: ${esc(next[1])}</button>` : ""}
        ${ws.alt.filter(a => a[0] !== it.status).map(a => `<button class="btn" type="button" data-stage="${a[0]}">${esc(a[1])}</button>`).join("")}
      </div>`}
      ${(it.flags || []).length ? `<div class="st">${it.flags.map(f => `<span class="pill s${f.sev}">${esc(f.text)}</span>`).join("")}</div>` : ""}
      <dl class="kv">
        <div><dt>Details</dt><dd>${ws.x(it)}</dd></div>
        <div><dt>Area</dt><dd>${esc(it.area)}</dd></div>
        <div><dt>${ws.ownerLabel}</dt><dd>${esc(it.owner || "Unassigned")}</dd></div>
        <div><dt>${ws.dueLabel}</dt><dd class="mono">${hm(it.due)}</dd></div>
        <div><dt>Phone</dt><dd class="mono" dir="ltr" style="text-align:start">${esc(it.phone)}</dd></div>
        <div><dt>Created</dt><dd class="mono">${hm(it.created)}</dd></div>
      </dl>
      <div class="sec"><h5>History</h5><ul class="hist">${[{ at: it.created, text: "Created" }, ...it.hist].sort((a, b) => a.at - b.at).map(h => `<li><time>${hm(h.at)}</time><span>${esc(h.text)}</span></li>`).join("")}</ul></div>
    </div>`;
}
function openDrawer(id) { openId = id; $("#drawer").hidden = false; $("#dScrim").hidden = false; renderDrawer(); }
function closeDrawer() { openId = null; $("#drawer").hidden = true; $("#dScrim").hidden = true; }
function openModal(html) { $("#modal").innerHTML = html; $("#modal").hidden = false; $("#mScrim").hidden = false; }
function closeModal() { $("#modal").hidden = true; $("#mScrim").hidden = true; }

let waLang = "ar";
function waModal(it, tplKey) {
  const T = w().templates; tplKey = tplKey && T[tplKey] ? tplKey : Object.keys(T)[0];
  const t = T[tplKey], txt = fill(waLang === "ar" ? t[2] : t[1], it, S.now);
  const href = "https://wa.me/" + it.phone.replace(/\D/g, "") + "?text=" + encodeURIComponent(txt);
  openModal(`
    <h4>WhatsApp ${esc(it.name)}</h4>
    <p>Pick a message. Names, times and order details fill in by themselves.</p>
    <div class="seg" role="group">${Object.entries(T).map(([k, v]) => `<button type="button" data-tplpick="${k}" data-id="${esc(it.id)}" aria-pressed="${k === tplKey}">${esc(v[0])}</button>`).join("")}</div>
    <div class="seg" role="group"><button type="button" data-lang="ar" data-id="${esc(it.id)}" data-tplk="${tplKey}" aria-pressed="${waLang === "ar"}">عربي</button><button type="button" data-lang="en" data-id="${esc(it.id)}" data-tplk="${tplKey}" aria-pressed="${waLang === "en"}">English</button></div>
    <textarea class="msg" id="waMsg" ${waLang === "ar" ? 'dir="rtl"' : ""} aria-label="Message">${esc(txt)}</textarea>
    <p>Demo numbers are not real. In a client's system this opens WhatsApp with the message ready to send.</p>
    <div class="row-btns" style="justify-content:flex-end">
      <button class="btn" type="button" data-act="copymsg">Copy</button>
      <a class="btn wa" id="waLink" href="${href}" target="_blank" rel="noopener">Open WhatsApp</a>
      <button class="btn primary" type="button" data-sent="${esc(it.id)}">Log as sent</button>
    </div>`);
  $("#waMsg").oninput = () => { $("#waLink").href = "https://wa.me/" + it.phone.replace(/\D/g, "") + "?text=" + encodeURIComponent($("#waMsg").value); };
}
function callModal(it) {
  openModal(`
    <h4>Call ${esc(it.name)}</h4>
    <p>Dial, talk, then pick what happened. It's saved to the history.</p>
    <div class="phone"><span class="mono">${esc(it.phone)}</span><div class="row-btns"><button class="btn sm" type="button" data-copy="${esc(it.phone)}">Copy</button><a class="btn sm primary" href="tel:${it.phone.replace(/\s/g, "")}">Dial</a></div></div>
    <div class="outs">${["Reached, all good", "Reached, issue logged", "No answer", "Wrong number"].map(o => `<button class="out" type="button" data-outcome="${o}" data-id="${esc(it.id)}">${o}</button>`).join("")}</div>`);
}

let tt;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3400); }
async function copy(text, btn) { try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; } catch (e) { toast("Select the text and press Ctrl+C."); } }

function simulate() {
  S.now += 15;
  Object.keys(WS).forEach((k, i) => {
    const r = rng(Math.floor(Math.random() * 1e9));
    WS[k].tick(S.ws[k], S.now, r);
    S.ws[k].items.forEach(it => { if (it.isNew) { it.flash = true; delete it.isNew; if (k !== "delivery" || !S.ws[k].rules.autoassign) log(k, `New ${WS[k].item.toLowerCase()} ${it.id} from ${it.name}`); } });
    evalRules(k);
  });
  save(); render();
  const flagged = st().items.filter(i => i.flags && i.flags.length).length;
  toast(`Moved to ${hm(S.now)}. ${flagged} item${flagged === 1 ? "" : "s"} need attention in ${w().name}.`);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.ws) { cur = d.ws; tab = "active"; closeDrawer(); return render(); }
  if (d.tab) { tab = d.tab; return render(); }
  if (d.open) return openDrawer(d.open);
  if (d.wa) { const it = find(d.wa); if (it) waModal(it, d.tpl || (it.flags || []).find(f => f.tpl)?.tpl); return; }
  if (d.call) { const it = find(d.call); if (it) callModal(it); return; }
  if (d.tplpick) return waModal(find(d.id), d.tplpick);
  if (d.lang) { waLang = d.lang; return waModal(find(d.id), d.tplk); }
  if (d.copy) return copy(d.copy, b);
  if (d.act === "copymsg") return copy($("#waMsg").value, b);
  if (d.sent) { const it = find(d.sent); it.hist.push({ at: S.now, text: "WhatsApp sent" }); log(cur, `WhatsApp sent to ${it.name} (${it.id})`); it.flash = true; save(); closeModal(); render(); return toast("Logged as sent."); }
  if (d.outcome) { const it = find(d.id); it.hist.push({ at: S.now, text: "Call: " + d.outcome }); log(cur, `Called ${it.name} (${it.id}): ${d.outcome}`); save(); closeModal(); render(); return toast("Call logged."); }
  if (d.stage) {
    const it = find(openId); if (!it) return;
    if (d.stage === "assigned" && !it.owner) { const ow = w().owners; it.owner = ow[Math.floor(Math.random() * ow.length)]; }
    if (d.stage === "onway" && !it.owner) it.owner = w().owners[0];
    setStage(it, d.stage, S.now); it.flash = true;
    log(cur, `${it.id} marked ${stageName(it, d.stage)}`);
    evalRules(cur); save(); render(); return toast(`${it.id}: ${stageName(it, d.stage)}`);
  }
  if (d.rule) { st().rules[d.rule] = !st().rules[d.rule]; const rl = w().rules.find(r => r.id === d.rule); log(cur, `Rule ${st().rules[d.rule] ? "switched on" : "switched off"}: ${rl.name}`); evalRules(cur); save(); return render(); }
  if (d.act === "close") return closeDrawer();
  if (d.act === "reset") { S = fresh(); closeModal(); closeDrawer(); save(); render(); return toast("Demo reset to 14:00."); }
});
$("#simBtn").onclick = simulate;
$("#resetBtn").onclick = () => openModal(`<h4>Reset the demo?</h4><p>All three workspaces go back to 14:00 with fresh sample data.</p><div class="row-btns" style="justify-content:flex-end"><button class="btn" type="button" data-act="mclose">Cancel</button><button class="btn primary" type="button" data-act="reset">Reset</button></div>`);
document.addEventListener("click", e => { if (e.target.closest('[data-act="mclose"]')) closeModal(); });
$("#dScrim").onclick = closeDrawer;
$("#mScrim").onclick = closeModal;
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#modal").hidden) closeModal(); else if (openId) closeDrawer(); } });

S = load();
render();
})();
</script>
</body>
</html>
